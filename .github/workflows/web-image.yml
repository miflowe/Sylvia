name: Web image

# Builds the web container and publishes it to GitHub's container registry (ghcr.io).
# Azure for Students blocks ACR remote builds, so the image is built here instead.
on:
  push:
    branches: [main]
    paths: [apps/web/**, packages/**, pnpm-lock.yaml, .github/workflows/web-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sylvia-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sylvia-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
