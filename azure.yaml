# Azure Developer CLI: `azd up` provisions infra/ and deploys the Functions app.
# The web app image is built by GitHub Actions (.github/workflows/web-image.yml) and rolled out with scripts/deploy-web.sh.
name: sylvia
metadata:
  template: sylvia@0.1.0
services:
  functions:
    project: ./apps/functions
    language: js
    host: function
    dist: deploy
hooks:
  prepackage:
    shell: sh
    run: pnpm install --frozen-lockfile && pnpm --filter @sylvia/functions build
